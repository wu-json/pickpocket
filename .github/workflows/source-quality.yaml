name: Source Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install aqua
        uses: aquaproj/aqua-installer@f6be09d5313d3af86e3ad665911c67b149a4498c # v4.0.4
        with:
          aqua_version: v2.56.6

      - name: Build
        run: just build

      - name: Vet
        run: just vet

      - name: Test
        run: just test
