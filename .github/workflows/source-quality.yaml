name: Source Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install aqua
        uses: aquaproj/aqua-installer@ea518c135a02fc11ff8024364510c181a5c6b342 # v4.0.3
        with:
          aqua_version: v2.43.1

      - name: Build
        run: just build

      - name: Vet
        run: just vet

      - name: Test
        run: just test
